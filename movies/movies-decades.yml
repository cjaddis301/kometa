#####################################################
#              Decade Collections                   #
#####################################################
templates:
  Decades:
    imdb_search:
      type: movie
      release.after: <<start_date>>-01-01
      release.before: <<end_date>>-12-31
      votes.gte: 10000
      sort_by: rating.desc
      limit: 150
    sort_title: "!B Best_of_<<start_date>>" 
    url_poster: https://theposterdb.com/api/assets/<<poster>>
    url_background: https://wallpapercave.com/wp/wp4016022.jpg
    sync_mode: sync
    collection_order: custom
    collection_mode: hide
    schedule: weekly(sunday)

collections:
  Best of 1950s:
    template: {name: Decades, start_date: 1950, end_date: 1959, poster: 495857}
    summary: A collection of films during the 1950s
  Best of 1960s:
    template: {name: Decades, start_date: 1960, end_date: 1969, poster: 495858}
    summary: A collection of films during the 1960s
  Best of 1970s:
