## This file is a template remove the .template to use the file

github:
  token: <<githubkey>>
libraries:
  Movies:
    metadata_path:
    - folder: config/movies/
    - pmm: basic
    - pmm: studio
    - pmm: genre
    - pmm: universe
    settings:
      missing_path: config/missing
  TV Shows:
    metadata_path:
    - folder: config/tv/
    - pmm: separator_chart
    - pmm: basic
    - pmm: network
    settings:
      missing_path: config/missing
settings:
  cache: true
  cache_expiration: 60
  asset_directory: config/assets
  missing_path: config/missing
  asset_folders: true
  asset_depth: 0
  create_asset_folders: true
  prioritize_assets: false
  dimensional_asset_rename: false
  download_url_assets: true
  show_missing_season_assets: false
  show_missing_episode_assets: false
  show_asset_not_needed: true
  sync_mode: append
  minimum_items: 1
  default_collection_order: 8
  delete_below_minimum: true
  delete_not_scheduled: false
  run_again_delay: 2
  missing_only_released: true
  only_filter_missing: false
  show_unmanaged: true
  show_unconfigured: true
  show_filtered: false
  show_options: false
  show_missing: true
  show_missing_assets: true
  save_report: false
  tvdb_language: eng
  ignore_ids: []
  ignore_imdb_ids: []
  item_refresh_delay: 0
  playlist_sync_to_user: all
  playlist_exclude_users: []
  playlist_report: false
  verify_ssl: true
  custom_repo: ''
  check_nightly: true
  save_missing: true
  collection_minimum: 1
  run_order:
  - operations
  - metadata
  - collections
  - overlays
plex: # Can be individually specified per library as well; REQUIRED for the script to run
  url: http://192-168-4-193.addis-nas.direct.quickconnect.to:32400/
  token: <<plexkey>>
  timeout: 60
  db_cache: ''
  clean_bundles: false
  empty_trash: false
  optimize: false
tmdb: # REQUIRED for the script to run
  apikey: <<tmdbkey>>
  language: en
  cache_expiration: 60
  region:
